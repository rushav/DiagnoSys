version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diagnosys
      POSTGRES_USER: diagnosys
      POSTGRES_PASSWORD: diagnosys
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagnosys"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://diagnosys:diagnosys@postgres:5432/diagnosys
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml_classifier:8001
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  ml_classifier:
    build:
      context: ./ml/classification
      dockerfile: Dockerfile
    environment:
      MODEL_CHECKPOINT: /app/checkpoints/latest
    ports:
      - "8001:8001"
    volumes:
      - ml_checkpoints:/app/checkpoints
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: uvicorn inference:app --host 0.0.0.0 --port 8001

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://diagnosys:diagnosys@postgres:5432/diagnosys
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SE_API_KEY: ${SE_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A jobs.celery_app worker --loglevel=info

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - redis
    command: celery -A scrapers.scheduler beat --loglevel=info

volumes:
  postgres_data:
  ml_checkpoints:
